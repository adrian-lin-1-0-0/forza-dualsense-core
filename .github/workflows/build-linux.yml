name: Build Linux Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Run Tests
        run: cargo test

      - name: Build Release
        run: cargo build --release

      - name: Package
        run: |
          zip -j forza-dualsense-core-linux-x86_64.zip target/release/forza-dualsense-core config.toml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forza-dualsense-core-linux-x86_64
          path: forza-dualsense-core-linux-x86_64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: forza-dualsense-core-linux-x86_64.zip
          generate_release_notes: true
