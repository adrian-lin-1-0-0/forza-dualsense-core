name: Build Linux Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Run Tests
        run: cargo test

      - name: Build Release
        run: cargo build --release

      - name: Package
        run: |
          zip -j forza-dualsense-core-linux-x86_64.zip target/release/forza-dualsense-core config.toml

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forza-dualsense-core-linux-x86_64
          path: forza-dualsense-core-linux-x86_64.zip

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: forza-dualsense-core-linux-x86_64.zip
          generate_release_notes: true
